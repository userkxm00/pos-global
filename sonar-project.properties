sonar.projectKey=userkxm00_pos-global
sonar.organization=userkxm00
sonar.projectName=pos-global
sonar.sourceEncoding=UTF-8

# Application source roots
sonar.sources=src,src-tauri

# Generated/dependency/build output that must not be analyzed
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/coverage/**,src-tauri/icons/**

# Tauri/Rust manifest is not at repository root.
sonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml

# Clippy runs in the existing Rust CI job, not inside the isolated Sonar scanner.
# Coverage/Quality Gate enforcement will be enabled after a real coverage pipeline exists.
sonar.rust.clippy.enabled=false
