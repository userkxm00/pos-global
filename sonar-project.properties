sonar.projectKey=userkxm00_pos-global
sonar.organization=userkxm00
sonar.projectName=pos-global
sonar.sourceEncoding=UTF-8

# Source and test directory boundaries
sonar.sources=src,src-tauri
sonar.tests=src/tests,src-tauri/src/tests

# Global artifact and build directory exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/coverage/**,src-tauri/icons/**,src/tests/**,src-tauri/src/tests/**

# Coverage exclusions:
# Presentational React layout components and stylesheet assets are excluded from unit line coverage;
# core application logic, i18n dictionaries, and context state layers are tested with real LCOV reports.
# SQLite database migrations (specifically Migration 020 triggers) are executed and tested via native
# rusqlite integration test suites; because the repository CI toolchain only produces TypeScript LCOV
# reports (coverage/lcov.info) and SonarCloud's PL/SQL sensor incorrectly assigns executable lines to
# SQLite trigger definitions without a SQL coverage source, Migration 020 is excluded from coverage accounting.
sonar.coverage.exclusions=src/components/**,src/styles/**,src/App.tsx,src/main.tsx,src-tauri/src/tests/**,src-tauri/src/db/migrations/020_stock_ledger_and_spatial_balances.sql
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusions for localized dictionaries
sonar.cpd.exclusions=src/i18n/**

# Rust analyzer configuration
sonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml
sonar.rust.clippy.enabled=false
