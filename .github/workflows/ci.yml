name: CI

# Public repository: GitHub-hosted standard runners are used automatically.
# Gitar and SonarQube Cloud remain complementary review/analysis layers.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend tooling for deterministic Tauri icon generation
        run: npm install --ignore-scripts
      - name: Build frontend for Tauri Rust checks
        run: npm run build
      - name: Generate Tauri icons from source SVG
        run: npx --no-install tauri icon src-tauri/app-icon.svg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run Rust and migration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan repository for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|sk_live_[A-Za-z0-9]+|SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY|DATABASE_PASSWORD)[[:space:]]*=[[:space:]]*[^#[:space:]]+' -- ':!.env.example' ':!node_modules' ':!target'; then
            echo 'Potential secret detected. Remove it or move it to protected secret storage.'
            exit 1
          fi
          echo 'No high-risk credential patterns detected.'

  supabase-schema-tests:
    name: Supabase Cloud Schema & RLS Runtime Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run Supabase migrations and behavioral tests
        env:
          PGPASSWORD: postgrespassword
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'EOF'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              email TEXT UNIQUE,
              created_at TIMESTAMPTZ DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS UUID
          LANGUAGE sql
          STABLE
          AS $$
              SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          EOF
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/001_phase1_identity_and_rls.sql
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/002_organization_branch_member_schema.sql
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/002_organization_branch_member_schema.sql
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rls_policies_test.sql
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/organization_branch_member_test.sql

  foundation-validation:
    name: Foundation specification validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate foundation specifications
        run: python .github/scripts/validate_foundation.py

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies & generate test coverage
        run: |
          npm install --ignore-scripts
          npm test
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
