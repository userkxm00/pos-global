name: CI

on:
  pull_request:
  push:
    branches: [main, foundation/v2]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Build frontend
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend tooling for deterministic Tauri icon generation
        run: npm install --ignore-scripts
      - name: Generate Tauri icons from source SVG
        run: npx --no-install tauri icon src-tauri/app-icon.svg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Rust and migration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|sk_live_[A-Za-z0-9]+|SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY|DATABASE_PASSWORD)[[:space:]]*=[[:space:]]*[^#[:space:]]+' -- ':!.env.example' ':!node_modules' ':!target'; then
            echo 'Potential secret detected. Remove it or move it to protected secret storage.'
            exit 1
          fi
          echo 'No high-risk credential patterns detected.'

  foundation-validation:
    name: Foundation specification validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate foundation specifications
        run: python .github/scripts/validate_foundation.py

  foundation-gate-evidence:
    name: Foundation gate evidence
    needs: [frontend, rust, secret-scan, foundation-validation]
    # Authoritative Foundation Gate evidence must be generated from the exact
    # branch head, never from a pull_request merge ref.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/foundation/v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact branch head
        env:
          EXPECTED_REF: refs/heads/foundation/v2
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "Exact branch head verified: $GITHUB_SHA"
      - name: Verify required gate jobs succeeded
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          SPEC_RESULT: ${{ needs.foundation-validation.result }}
        run: |
          set -euo pipefail
          printf 'frontend=%s\nrust=%s\nsecret-scan=%s\nfoundation-validation=%s\n' \
            "$FRONTEND_RESULT" "$RUST_RESULT" "$SECRET_RESULT" "$SPEC_RESULT"
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SECRET_RESULT" = success
          test "$SPEC_RESULT" = success
      - name: Emit exact-head evidence
        run: python .github/scripts/emit_foundation_evidence.py
      - name: Upload exact-head evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-evidence-${{ github.sha }}
          path: foundation-evidence.json
          if-no-files-found: error
      - name: Publish verification summary
        run: |
          {
            echo '## Foundation Gate Evidence'
            echo
            echo "Exact branch: \`${GITHUB_REF}\`"
            echo "Exact commit: \`${GITHUB_SHA}\`"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'All mandatory automated foundation jobs completed successfully.'
            echo 'The uploaded artifact is authoritative exact-head machine evidence for foundation/v2.'
          } >> "$GITHUB_STEP_SUMMARY"
