name: CI (Manual Verification)

# GitHub-hosted Actions quota is intentionally not used as an automatic merge gate.
# Primary ongoing review: Gitar + SonarQube Cloud.
# Run this workflow manually only when GitHub Actions capacity is available.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx --no-install tauri icon src-tauri/app-icon.svg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  foundation-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/validate_foundation.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|sk_live_[A-Za-z0-9]+|SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY|DATABASE_PASSWORD)[[:space:]]*=[[:space:]]*[^#[:space:]]+' -- ':!.env.example' ':!node_modules' ':!target'; then
            echo 'Potential secret detected.'
            exit 1
          fi
          echo 'No high-risk credential patterns detected.'
