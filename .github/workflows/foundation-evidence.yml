name: Foundation Gate Evidence

# Public repository: automatic exact-head verification is enabled on main.
# Manual dispatch remains available for explicit re-verification.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Exact-head foundation verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact main head
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          ACTUAL_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_SHA" = "$HEAD_SHA"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          echo "Exact main head verified: $HEAD_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Generate deterministic Tauri icons
        run: npx --no-install tauri icon src-tauri/app-icon.svg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust and migration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate foundation specifications
        run: python .github/scripts/validate_foundation.py

      - name: Scan repository for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY|sk_live_[A-Za-z0-9]+|SUPABASE_(SERVICE_ROLE_KEY|SECRET_KEY|DATABASE_PASSWORD)[[:space:]]*=[[:space:]]*[^#[:space:]]+' -- ':!.env.example' ':!node_modules' ':!target'; then
            echo 'Potential secret detected. Remove it or move it to protected secret storage.'
            exit 1
          fi
          echo 'No high-risk credential patterns detected.'

      - name: Emit authoritative exact-head evidence
        env:
          FOUNDATION_EVIDENCE_SHA: ${{ github.sha }}
          FOUNDATION_EVIDENCE_RUN_ID: ${{ github.run_id }}
          FOUNDATION_EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FOUNDATION_EVIDENCE_EVENT: ${{ github.event_name }}
          FOUNDATION_EVIDENCE_REF: refs/heads/main
        run: python .github/scripts/emit_foundation_evidence.py

      - name: Upload authoritative exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-evidence-${{ github.sha }}
          path: foundation-evidence.json
          if-no-files-found: error

      - name: Publish verification summary
        run: |
          {
            echo '## Foundation Gate Evidence'
            echo
            echo "Exact branch: \`refs/heads/main\`"
            echo "Exact commit: \`${GITHUB_SHA}\`"
            echo "Verification workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'All mandatory foundation validation steps completed successfully on the exact post-change main branch head.'
            echo 'The uploaded artifact is authoritative exact-head machine evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
