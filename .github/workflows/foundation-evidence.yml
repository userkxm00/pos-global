name: Foundation Gate Evidence

on:
  push:
    branches: [foundation/v2]

permissions:
  actions: read
  contents: read

concurrency:
  group: foundation-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify branch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git ls-remote origin refs/heads/foundation/v2 | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Exact foundation/v2 head verified: $EXPECTED_SHA"

      - name: Locate successful PR validation for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow CI --commit "$EXPECTED_SHA" --event pull_request --status completed --limit 20 --json databaseId,conclusion,headSha,url 2>/dev/null || true)"
          test -n "$runs"
          echo "$runs"
          success_run="$(echo "$runs" | jq -r --arg sha "$EXPECTED_SHA" '.[] | select(.conclusion == "success" and .headSha == $sha) | .databaseId' | head -n1)"
          if [ -z "$success_run" ]; then
            echo 'No successful PR CI run for this exact SHA yet.'
            exit 1
          fi
          echo "VALIDATION_RUN_ID=$success_run" >> "$GITHUB_ENV"

      - name: Emit exact-head evidence
        env:
          FOUNDATION_EVIDENCE_SHA: ${{ github.sha }}
          FOUNDATION_EVIDENCE_RUN_ID: ${{ env.VALIDATION_RUN_ID }}
          FOUNDATION_EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ env.VALIDATION_RUN_ID }}
          FOUNDATION_EVIDENCE_EVENT: push
          FOUNDATION_EVIDENCE_REF: refs/heads/foundation/v2
        run: python .github/scripts/emit_foundation_evidence.py

      - name: Upload authoritative exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-evidence-${{ github.sha }}
          path: foundation-evidence.json
          if-no-files-found: error

      - name: Publish verification summary
        env:
          TESTED_SHA: ${{ github.sha }}
          TEST_RUN_ID: ${{ env.VALIDATION_RUN_ID }}
        run: |
          {
            echo '## Foundation Gate Evidence'
            echo
            echo "Exact branch: \`refs/heads/foundation/v2\`"
            echo "Exact commit: \`${TESTED_SHA}\`"
            echo "Validation PR CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}"
            echo
            echo 'A successful PR validation exists for this exact commit, and foundation/v2 still points to that commit.'
            echo 'The uploaded artifact is the authoritative exact-head machine evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
