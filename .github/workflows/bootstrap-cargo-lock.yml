name: Bootstrap Cargo.lock

on:
  push:
    branches:
      - fix/sonar-cargo-lock
    paths:
      - src-tauri/Cargo.toml
      - .github/workflows/bootstrap-cargo-lock.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit lockfile
        run: |
          if test -f src-tauri/Cargo.lock && git ls-files --error-unmatch src-tauri/Cargo.lock >/dev/null 2>&1 && git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock is already tracked and up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "build: add Cargo.lock for reproducible Rust builds"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
